<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delay-Doppler Three.js Surface</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b14;
      color: #cbd5e1;
      font-family: Consolas, "Microsoft YaHei", monospace;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background:
        radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.12), transparent 42%),
        linear-gradient(180deg, #080b14 0%, #030712 100%);
    }
    .hud {
      position: fixed;
      inset: 10px 12px auto 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      text-shadow: 0 1px 4px #020617;
    }
    .title {
      color: #38bdf8;
      font-family: "Microsoft YaHei", Consolas, monospace;
      font-weight: 800;
      font-size: 13px;
    }
    .legend {
      color: #94a3b8;
      font-size: 10px;
      line-height: 1.45;
      text-align: right;
      padding: 5px 8px;
      border: 1px solid rgba(71, 85, 105, 0.35);
      border-radius: 8px;
      background: rgba(8, 11, 20, 0.50);
    }
    .x { color: #38bdf8; }
    .y { color: #4ade80; }
    .z { color: #fbbf24; }
    .status {
      position: fixed;
      left: 14px;
      bottom: 12px;
      color: #94a3b8;
      font-size: 11px;
      pointer-events: none;
      text-shadow: 0 1px 4px #020617;
      padding: 3px 7px;
      border-radius: 7px;
      background: rgba(8, 11, 20, 0.50);
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud">
    <div class="title">3D Delay-Doppler Signal Intensity</div>
    <div class="legend">
      <span class="x">X Doppler index</span><br>
      <span class="y">Y Delay index</span><br>
      <span class="z">Z Normalized intensity</span>
    </div>
  </div>
  <div class="status" id="status">Waiting for NTN-TDL ddGrid...</div>

  <script src="./assets/three.min.js"></script>
  <script>
    const DD_SURFACE_VERSION = "cold-blue-v7";
    const canvas = document.getElementById("scene");
    const statusEl = document.getElementById("status");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setClearColor(0x080b14, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
    if ("outputColorSpace" in renderer && THREE.SRGBColorSpace) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    } else if ("outputEncoding" in renderer && THREE.sRGBEncoding) {
      renderer.outputEncoding = THREE.sRGBEncoding;
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(25, 1, 0.1, 100);
    camera.position.set(-0.05, 2.35, 5.05);
    camera.lookAt(0, 0.52, 0.00);

    const root = new THREE.Group();
    root.position.y = 0.18;
    root.rotation.x = -0.56;
    root.rotation.y = 0.34;
    scene.add(root);

    scene.add(new THREE.AmbientLight(0x7dd8ff, 0.34));
    const keyLight = new THREE.DirectionalLight(0xf2fcff, 0.80);
    keyLight.position.set(2.8, 4.5, 3.0);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x31d4ff, 0.42);
    rimLight.position.set(-4.0, 2.0, -2.0);
    scene.add(rimLight);
    const warmLight = new THREE.DirectionalLight(0xff8a38, 0.18);
    warmLight.position.set(-3.8, 1.4, 2.6);
    scene.add(warmLight);

    const surfaceMaterial = new THREE.MeshPhongMaterial({
      side: THREE.DoubleSide,
      vertexColors: true,
      shininess: 14,
      specular: 0x15384d,
      emissive: 0x021019,
    });
    const wireMaterial = new THREE.LineBasicMaterial({ color: 0x8fe6ff, transparent: true, opacity: 0.02 });
    const axisMaterialX = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.95 });
    const axisMaterialY = new THREE.LineBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.95 });
    const axisMaterialZ = new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.95 });
    const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.44, side: THREE.DoubleSide });

    let surfaceMesh = null;
    let wireMesh = null;
    let floorMesh = null;
    let axes = [];
    let dragActive = false;
    let lastPointer = null;
    let targetYaw = 0.48;
    let targetPitch = -0.62;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function colorFor(v) {
      const stops = [
        [0.00, [0.02, 0.05, 0.20]],
        [0.18, [0.04, 0.11, 0.40]],
        [0.42, [0.06, 0.28, 0.76]],
        [0.66, [0.10, 0.86, 0.96]],
        [0.84, [0.50, 0.84, 0.22]],
        [0.95, [0.96, 0.88, 0.14]],
        [1.00, [0.98, 0.82, 0.10]],
      ];
      const x = Math.max(0, Math.min(1, v));
      for (let i = 0; i < stops.length - 1; i++) {
        const [p0, c0] = stops[i];
        const [p1, c1] = stops[i + 1];
        if (x <= p1) {
          const t = (x - p0) / Math.max(1e-6, p1 - p0);
          return new THREE.Color(
            c0[0] + (c1[0] - c0[0]) * t,
            c0[1] + (c1[1] - c0[1]) * t,
            c0[2] + (c1[2] - c0[2]) * t,
          );
        }
      }
      return new THREE.Color(0.98, 0.82, 0.12);
    }

    function removeObject(obj) {
      if (!obj) return;
      root.remove(obj);
      obj.geometry?.dispose?.();
      obj.material?.dispose?.();
    }

    function addLine(points, material) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, material);
      root.add(line);
      axes.push(line);
    }

    function smoothGrid(grid, outRows, outCols) {
      const srcRows = grid.length;
      const srcCols = grid[0].length;
      const out = [];
      for (let r = 0; r < outRows; r++) {
        const srcR = (r / Math.max(1, outRows - 1)) * Math.max(1, srcRows - 1);
        const r0 = Math.floor(srcR);
        const r1 = Math.min(srcRows - 1, r0 + 1);
        const tr = srcR - r0;
        const row = [];
        for (let c = 0; c < outCols; c++) {
          const srcC = (c / Math.max(1, outCols - 1)) * Math.max(1, srcCols - 1);
          const c0 = Math.floor(srcC);
          const c1 = Math.min(srcCols - 1, c0 + 1);
          const tc = srcC - c0;
          const v00 = Number(grid[r0][c0]) || 0;
          const v01 = Number(grid[r0][c1]) || 0;
          const v10 = Number(grid[r1][c0]) || 0;
          const v11 = Number(grid[r1][c1]) || 0;
          const v0 = v00 + (v01 - v00) * tc;
          const v1 = v10 + (v11 - v10) * tc;
          row.push(v0 + (v1 - v0) * tr);
        }
        out.push(row);
      }
      return out;
    }

    function rebuildAxes(xSpan, ySpan, zScale) {
      while (axes.length) removeObject(axes.pop());
      const x0 = -xSpan / 2, x1 = xSpan / 2;
      const y0 = -ySpan / 2, y1 = ySpan / 2;
      addLine([new THREE.Vector3(x0, 0, y0), new THREE.Vector3(x1, 0, y0)], axisMaterialX);
      addLine([new THREE.Vector3(x0, 0, y0), new THREE.Vector3(x0, 0, y1)], axisMaterialY);
      addLine([new THREE.Vector3(x0, 0, y0), new THREE.Vector3(x0, zScale, y0)], axisMaterialZ);
      const grid = new THREE.GridHelper(Math.max(xSpan, ySpan), 8, 0x334155, 0x1e293b);
      grid.position.y = -0.035;
      root.add(grid);
      axes.push(grid);
    }

    function updateSurface(grid) {
      if (!Array.isArray(grid) || !grid.length || !Array.isArray(grid[0])) return;
      const sourceRows = grid.length;
      const sourceCols = grid[0].length;
      const smoothRows = Math.max(32, Math.floor(sourceRows * 1.02));
      const smoothCols = Math.max(32, Math.floor(sourceCols * 1.02));
      const smoothed = smoothGrid(grid, smoothRows, smoothCols);
      const rows = smoothed.length;
      const cols = smoothed[0].length;
      const xSpan = 3.10;
      const ySpan = 2.02;
      const zScale = 0.78;
      const positions = [];
      const colors = [];
      const indices = [];
      let maxValue = 0;
      let maxPoint = [0, 0];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const raw = Number(smoothed[r][c]) || 0;
          const base = Math.max(0, Math.min(1, raw));
          const v = Math.pow(base, 1.32);
          if (v > maxValue) {
            maxValue = v;
            maxPoint = [r, c];
          }
          const x = (c / Math.max(1, cols - 1) - 0.5) * xSpan;
          const z = (r / Math.max(1, rows - 1) - 0.5) * ySpan;
          const y = v * zScale;
          positions.push(x, y, z);
          const color = colorFor(v);
          colors.push(color.r, color.g, color.b);
        }
      }

      for (let r = 0; r < rows - 1; r++) {
        for (let c = 0; c < cols - 1; c++) {
          const a = r * cols + c;
          const b = a + 1;
          const d = (r + 1) * cols + c;
          const e = d + 1;
          indices.push(a, d, b, b, d, e);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      removeObject(surfaceMesh);
      removeObject(wireMesh);
      removeObject(floorMesh);
      surfaceMesh = new THREE.Mesh(geometry, surfaceMaterial);
      root.add(surfaceMesh);
      wireMesh = new THREE.LineSegments(new THREE.WireframeGeometry(geometry), wireMaterial);
      root.add(wireMesh);
      floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(xSpan, ySpan), floorMaterial);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.position.y = -0.035;
      root.add(floorMesh);
      rebuildAxes(xSpan, ySpan, zScale);
      const peakDelay = Math.round((maxPoint[0] / Math.max(1, rows - 1)) * Math.max(1, sourceRows - 1)) + 1;
      const peakDoppler = Math.round((maxPoint[1] / Math.max(1, cols - 1)) * Math.max(1, sourceCols - 1)) + 1;
      statusEl.textContent = `DD grid ${sourceCols} x ${sourceRows} | peak=${maxValue.toFixed(2)} at delay ${peakDelay}, doppler ${peakDoppler}`;
    }

    window.updateDdSurface = function(payload) {
      window.__hasLiveDd = true;
      updateSurface(payload && payload.grid ? payload.grid : payload);
    };

    function demoGrid() {
      const rows = 32, cols = 32;
      const phase = performance.now() * 0.0018;
      const grid = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          const p1 = Math.exp(-((r - 12 - Math.sin(phase) * 4) ** 2 + (c - 17) ** 2) / 10);
          const p2 = Math.exp(-((r - 23) ** 2 + (c - 7 - Math.cos(phase) * 4) ** 2) / 18);
          row.push(Math.min(1, 0.12 + 0.55 * p1 + 0.35 * p2 + 0.05 * Math.sin(r * 0.7 + c * 0.4 + phase)));
        }
        grid.push(row);
      }
      updateSurface(grid);
    }

    let lastDemo = 0;
    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / Math.max(1, innerHeight);
      camera.updateProjectionMatrix();
    }

    canvas.addEventListener("pointerdown", (event) => {
      dragActive = true;
      lastPointer = { x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!dragActive || !lastPointer) return;
      targetYaw += (event.clientX - lastPointer.x) * 0.006;
      targetPitch = clamp(targetPitch + (event.clientY - lastPointer.y) * 0.004, -0.95, -0.28);
      lastPointer = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener("pointerup", () => {
      dragActive = false;
      lastPointer = null;
    });

    function animate(now) {
      if (!dragActive) {
        targetYaw = 0.34 + Math.sin(now * 0.00015) * 0.018;
      }
      root.rotation.y += (targetYaw - root.rotation.y) * 0.05;
      root.rotation.x += (targetPitch - root.rotation.x) * 0.05;
      renderer.render(scene, camera);
      if (now - lastDemo > 1200 && !window.__hasLiveDd) {
        lastDemo = now;
        demoGrid();
      }
      requestAnimationFrame(animate);
    }
    addEventListener("resize", resize);
    resize();
    demoGrid();
    console.info(`Delay-Doppler Three.js surface initialized (${DD_SURFACE_VERSION})`);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
